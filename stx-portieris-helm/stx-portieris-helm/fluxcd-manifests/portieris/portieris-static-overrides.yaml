replicaCount: 3
namespace: portieris
images:
  tags:
    portieris: icr.io/portieris/portieris:v0.14.0
image:
  repository: icr.io/portieris/portieris
  pullSecret: default-registry-key
  tag: v0.14.0
tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
livenessProbe:
  initialDelaySeconds: 17
  periodSeconds: 19
  timeoutSeconds: 11
readinessProbe:
  initialDelaySeconds: 17
  periodSeconds: 19
  timeoutSeconds: 11
SkipSecretCreation: false
UseCertManager: true
